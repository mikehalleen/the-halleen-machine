<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Note — {{PROJECT}}</title>
  <style>
    :root {
      color-scheme: dark;
      --thm-orange: #ff7c00;
      --bg: #0b0f19;
      --panel: #171717;
      --text: #fafafa;
      --muted: rgba(250, 250, 250, 0.62);
      --border: #444444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 1rem;
      font: 16px/1.5 "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 640px;
      margin-inline: auto;
    }
    h1 { font-size: 1.1rem; margin: 0 0 0.25rem 0; }
    .project { color: var(--muted); font-size: 0.85rem; margin: 0 0 1rem 0; }
    .item-chip {
      display: inline-block;
      font-weight: 700;
      color: var(--thm-orange);
      border: 1px solid var(--thm-orange);
      border-radius: 999px;
      padding: 0.1rem 0.7rem;
      margin-bottom: 0.75rem;
    }
    textarea {
      width: 100%;
      min-height: 7rem;
      padding: 0.6rem;
      font: inherit;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .priority { display: flex; gap: 1.25rem; margin: 0.75rem 0 1rem 0; color: var(--muted); }
    .priority label { display: flex; align-items: center; gap: 0.4rem; }
    button {
      width: 100%;
      padding: 0.8rem;
      font: inherit;
      font-weight: 700;
      background: var(--thm-orange);
      color: #000;
      border: none;
      border-radius: 8px;
    }
    button:disabled { opacity: 0.5; }
    .result { margin-top: 1rem; padding: 0.75rem 1rem; border-radius: 8px; display: none; }
    .result.ok { display: block; background: #14532d; }
    .result.err { display: block; background: #7f1d1d; }
    a.back { color: var(--muted); display: inline-block; margin-top: 1.5rem; }
  </style>
</head>
<body>
  <h1>Note to the agent</h1>
  <p class="project">{{PROJECT}}</p>
  <span class="item-chip" id="item-chip" hidden></span>
  <form id="note-form">
    <textarea name="text" required placeholder="What should the agent know?"></textarea>
    <div class="priority">
      <label><input type="radio" name="priority" value="urgent" checked> urgent — act now</label>
      <label><input type="radio" name="priority" value="batch"> next checkpoint</label>
    </div>
    <button type="submit">Send</button>
  </form>
  <div class="result" id="result"></div>
  <a class="back" href="/">← back to gallery</a>
  <script>
    var itemId = "{{ITEM_ID}}" || null;
    if (itemId) {
      var chip = document.getElementById("item-chip");
      chip.textContent = itemId;
      chip.hidden = false;
    }
    document.getElementById("note-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      var btn = this.querySelector("button");
      btn.disabled = true;
      var result = document.getElementById("result");
      try {
        var resp = await fetch("/api/notes", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            project: "{{PROJECT}}",
            priority: this.priority.value,
            item_id: itemId,
            text: this.text.value
          })
        });
        var data = await resp.json();
        if (data.status === "ok") {
          result.className = "result ok";
          result.textContent = "✓ sent — " + data.note_id;
          this.reset();
        } else {
          result.className = "result err";
          result.textContent = "✗ " + (data.reason || "failed");
        }
      } catch (err) {
        result.className = "result err";
        result.textContent = "✗ " + err;
      }
      btn.disabled = false;
    });
  </script>
</body>
</html>
